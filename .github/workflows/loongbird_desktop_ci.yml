          retention-days: 14

      - name: Upload to Loongbird Gateway
        if: ${{ inputs.upload_to_gateway }}
        env:
          LOONGBIRD_GATEWAY_URL: ${{ inputs.gateway_url }}
          LOONGBIRD_API_TOKEN: ${{ secrets.LOONGBIRD_API_TOKEN }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.allow_413_fallback }}" = "true" ]; then
            EXTRA_FLAGS="--allow-413-fallback"
          fi
          python3 shorebird/ci/loongbird/upload_artifacts.py \
            --upload-dir staged_artifacts \
            $EXTRA_FLAGS

  linux-android-gen-snapshot:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: arm64
            gn_cpu_flag: '--android-cpu=arm64'
            out_dir: android_release_arm64
            archive_subdir: android-arm64-release
          - cpu: arm
            gn_cpu_flag: ''
            out_dir: android_release
            archive_subdir: android-arm-release
          - cpu: x64
            gn_cpu_flag: '--android-cpu=x64'
            out_dir: android_release_x64
            archive_subdir: android-x64-release
    name: '🐧 Linux x64 Android ${{ matrix.cpu }} gen_snapshot'
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - name: Checkout loongbird_flutter
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git auth & depot_tools
