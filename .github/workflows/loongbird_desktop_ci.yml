name: Loongbird Desktop & Cross-Host CI (Linux & Windows)

# Builds all Linux x64 and Windows x64 Loongbird Engine / Dart SDK / Android
# host gen_snapshot / patch CLI artifacts, uploads them to GitHub Actions
# Artifacts and optionally to Loongbird's self-hosted Engine Artifact Gateway,
# and runs automated zero-local-engine Linux & Windows Desktop hot-update E2E.
#
# Required / Optional Repository Secrets:
#   LOONGBIRD_DART_SDK_TOKEN  - GitHub PAT with read access to cyjaysong/loongbird_dart_sdk
#                               (required while loongbird_dart_sdk is private)
#   LOONGBIRD_API_TOKEN       - Loongbird gateway Bearer token (sb_api_...)
#                               (required for gateway upload & E2E)
#   LOONGBIRD_CLI_GIT_URL     - Git clone URL for loongbird CLI repo (required for E2E)
#   LOONGBIRD_CLI_GIT_TOKEN   - Optional token (or user:token) if CLI repo is private

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (all, linux, windows)'
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
      upload_to_gateway:
        description: 'Upload built artifacts directly to Loongbird Gateway'
        type: boolean
        default: true
      allow_413_fallback:
        description: 'Warn instead of failing if CDN returns HTTP 413 on large zips (still saved as GHA artifacts)'
        type: boolean
        default: true
      run_e2e:
        description: 'Run automated zero-local-engine Linux/Windows desktop hot-update E2E after builds'
        type: boolean
        default: true
      gateway_url:
        description: 'Loongbird Engine Artifact Gateway base URL'
        type: string
        default: 'https://api.loongbird.cyjay.fun'
      e2e_app_id:
        description: 'Isolated E2E Loongbird app_id'
        type: string
        default: '1eb9c933-8d08-4a57-9031-d72e990fa3d3'
      loongbird_cli_ref:
        description: 'Branch or tag of loongbird CLI repo for E2E'
        type: string
        default: 'loongbird_3.44.9'

concurrency:
  group: loongbird-desktop-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # LINUX x64 SHARDS
  # ==========================================================================

  linux-host-release:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    name: '🐧 Linux x64 Host Release (Dart SDK + GTK + patch)'
    steps:
      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout loongbird_flutter
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Linux build dependencies & Rust target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libfreetype6-dev pkg-config ninja-build curl zip unzip
          rustup target add x86_64-unknown-linux-gnu

      - name: Configure git auth & depot_tools
        env:
          LOONGBIRD_DART_SDK_TOKEN: ${{ secrets.LOONGBIRD_DART_SDK_TOKEN }}
        run: |
          if [ -n "$LOONGBIRD_DART_SDK_TOKEN" ]; then
            git config --global url."https://x-access-token:${LOONGBIRD_DART_SDK_TOKEN}@github.com/cyjaysong/loongbird_dart_sdk".insteadOf "https://github.com/cyjaysong/loongbird_dart_sdk"
            git config --global url."https://x-access-token:${LOONGBIRD_DART_SDK_TOKEN}@github.com/CyJaySong/loongbird_dart_sdk".insteadOf "https://github.com/CyJaySong/loongbird_dart_sdk"
          fi
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: gclient sync (minimal Linux host deps)
        run: |
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": ".",
              "url": "https://github.com/cyjaysong/loongbird_flutter.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {
                "download_android_deps": False,
                "download_fuchsia_deps": False,
                "download_emsdk": False,
                "download_esbuild": False,
                "download_jdk": False,
                "download_dart_sdk": False,
                "setup_githooks": False,
              },
            },
          ]
          EOF
          gclient sync --no-history --shallow --delete_unversioned_trees

      - name: Build Linux host_release (dart_sdk + flutter_gtk) & patch CLI
        run: |
          ENGINE_REV="$(tr -d '[:space:]' < bin/internal/engine.version)"
          echo "ENGINE_REV=$ENGINE_REV" >> "$GITHUB_ENV"
          echo "Building for ENGINE_REV=$ENGINE_REV"

          cargo build --release --manifest-path engine/src/flutter/third_party/updater/patch/Cargo.toml

          python3 shorebird/ci/loongbird/run_gn.py -- --runtime-mode=release
          ninja -C engine/src/out/host_release \
            dart_sdk \
            flutter/shell/platform/linux:flutter_gtk

      - name: Package & stage Linux host_release artifacts
        run: |
          python3 shorebird/ci/loongbird/upload_artifacts.py \
            --zip-dir "engine/src/out/host_release/dart-sdk=staged_tmp/dart-sdk-linux-x64.zip:dart-sdk" \
            --zip-file "engine/src/flutter/third_party/updater/patch/target/release/patch=staged_tmp/patch-linux-x64.zip:patch" \
            --stage-dir staged_artifacts \
            --map "staged_tmp/dart-sdk-linux-x64.zip=flutter_infra_release/flutter/${ENGINE_REV}/dart-sdk-linux-x64.zip" \
            --map "engine/src/out/host_release/zip_archives/linux-x64-release/linux-x64-flutter-gtk.zip=flutter_infra_release/flutter/${ENGINE_REV}/linux-x64-release/linux-x64-flutter-gtk.zip" \
            --map "staged_tmp/patch-linux-x64.zip=shorebird/${ENGINE_REV}/patch-linux-x64.zip"

      - name: Upload GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loongbird-linux-host-release-${{ env.ENGINE_REV }}
          path: staged_artifacts
          retention-days: 14

      - name: Upload to Loongbird Gateway
        if: ${{ inputs.upload_to_gateway }}
        env:
          LOONGBIRD_GATEWAY_URL: ${{ inputs.gateway_url }}
          LOONGBIRD_API_TOKEN: ${{ secrets.LOONGBIRD_API_TOKEN }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.allow_413_fallback }}" = "true" ]; then
            EXTRA_FLAGS="--allow-413-fallback"
          fi
          python3 shorebird/ci/loongbird/upload_artifacts.py \
            --upload-dir staged_artifacts \
            $EXTRA_FLAGS

  linux-host-debug:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    name: '🐧 Linux x64 Host Debug Artifacts'
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - name: Checkout loongbird_flutter
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Linux build dependencies & Rust target
