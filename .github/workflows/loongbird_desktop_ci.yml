  # ==========================================================================
  # NATIVE ARM64 PURE-ENGINE FUNCTIONAL VERIFICATION
  # ==========================================================================

  verify-linux-arm64:
    if: >-
      ${{
        !cancelled() &&
        inputs.run_verify &&
        (inputs.platforms == 'all' || inputs.platforms == 'arm64' || inputs.platforms == 'linux-arm64') &&
        (
          inputs.verify_only ||
          (
            needs.linux-arm64-host-release.result == 'success' &&
            needs.linux-arm64-host-debug.result == 'success'
          )
        )
      }}
    needs:
      - linux-arm64-host-release
      - linux-arm64-host-debug
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    name: '🧪 Linux ARM64 Pure-Engine Functional Verification'
    steps:
      - name: Checkout loongbird_flutter
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Linux ARM64 Flutter desktop & Xvfb runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang g++ cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            xvfb libgl1-mesa-dri mesa-utils openssl

      - name: Fetch staged Linux ARM64 artifacts from GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ENGINE_REV="$(tr -d '[:space:]' < bin/internal/engine.version)"
          python3 shorebird/ci/loongbird/fetch_gha_artifacts.py \
            --platform linux \
            --arch arm64 \
            --engine-rev "$ENGINE_REV" \
            --output-dir staged_artifacts

      - name: Run 4-stage Linux ARM64 pure-engine functional verification
        run: |
          ENGINE_REV="$(tr -d '[:space:]' < bin/internal/engine.version)"
          python3 shorebird/ci/loongbird/verify_engine.py \
            --platform linux \
            --arch arm64 \
            --artifacts-dir staged_artifacts \
            --flutter-root "$PWD" \
            --engine-rev "$ENGINE_REV"

  verify-windows-arm64:
    if: >-
      ${{
        !cancelled() &&
        inputs.run_verify &&
        (inputs.platforms == 'all' || inputs.platforms == 'arm64' || inputs.platforms == 'windows-arm64') &&
        (
          inputs.verify_only ||
          (
            needs.windows-arm64-host-release.result == 'success' &&
            needs.windows-arm64-host-debug.result == 'success'
          )
        )
      }}
    needs:
      - windows-arm64-host-release
      - windows-arm64-host-debug
    runs-on: windows-11-arm
    timeout-minutes: 45
    name: '🧪 Windows ARM64 Pure-Engine Functional Verification'
    steps:
      - name: Enable git longpaths
        shell: pwsh
        run: |
          git config --system core.longpaths true
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Checkout loongbird_flutter
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch staged Windows ARM64 artifacts from GitHub Actions
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8:replace'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $engineRev = (Get-Content -Raw bin/internal/engine.version).Trim()
          python shorebird/ci/loongbird/fetch_gha_artifacts.py `
            --platform windows `
            --arch arm64 `
            --engine-rev "$engineRev" `
            --output-dir staged_artifacts

      - name: Run 4-stage Windows ARM64 pure-engine functional verification
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8:replace'
        run: |
          $engineRev = (Get-Content -Raw bin/internal/engine.version).Trim()
          python shorebird/ci/loongbird/verify_engine.py `
            --platform windows `
            --arch arm64 `
            --artifacts-dir staged_artifacts `
            --flutter-root "$PWD" `
            --engine-rev "$engineRev"
