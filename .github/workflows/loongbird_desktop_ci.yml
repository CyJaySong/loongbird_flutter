            if ($LASTEXITCODE -eq 0) {
              "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "Windows Android ${{ matrix.cpu }} gen_snapshot already exists on gateway; skipping build."
              exit 0
            }
          }
          "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0

      - name: Free runner disk space
        if: ${{ steps.check.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Android", "C:\ghcup", "C:\hostedtoolcache\windows\CodeQL"

