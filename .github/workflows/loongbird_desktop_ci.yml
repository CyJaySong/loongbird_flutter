name: Loongbird Desktop & Cross-Host CI (Linux & Windows)

# Builds all Linux x64 and Windows x64 Loongbird Engine / Dart SDK / Android
# host gen_snapshot / patch CLI artifacts, uploads them to GitHub Actions
# Artifacts and optionally to Loongbird's self-hosted Engine Artifact Gateway,
# and runs pure-engine functional verification (Dart SDK + AOT + Android 3-ABI
# gen_snapshot + Rust patch + 3-run desktop RSA-2048 strict hot-update against
# local 127.0.0.1 mock servers — zero CLI or external gateway dependency).
#
# Required / Optional Repository Secrets:
#   LOONGBIRD_DART_SDK_TOKEN  - GitHub PAT with read access to cyjaysong/loongbird_dart_sdk
#                               (required while loongbird_dart_sdk is private)
#   LOONGBIRD_API_TOKEN       - Optional Loongbird gateway Bearer token (sb_api_...)
#                               (only needed when upload_to_gateway=true or skip_existing_builds=true)

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build/verify (all, linux, windows, arm64, linux-arm64, windows-arm64)'
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
          - arm64
          - linux-arm64
          - windows-arm64
      verify_only:
        description: 'Skip all build shards and only run pure-engine verification against latest GHA artifacts'
        type: boolean
        default: false
      upload_to_gateway:
        description: 'Upload built artifacts directly to Loongbird Gateway'
        type: boolean
        default: true
      skip_existing_builds:
        description: 'Skip build shards whose output artifacts already exist on the Loongbird Gateway'
        type: boolean
        default: true
      allow_413_fallback:
        description: 'Warn instead of failing if CDN returns HTTP 413 on large zips (still saved as GHA artifacts)'
        type: boolean
        default: true
      run_verify:
        description: 'Run pure-engine Linux/Windows functional verification after builds'
        type: boolean
        default: true
      gateway_url:
        description: 'Loongbird Engine Artifact Gateway base URL'
        type: string
        default: 'https://api.loongbird.cyjay.fun'

concurrency:
  group: loongbird-desktop-ci-${{ github.ref }}-${{ inputs.platforms }}
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # LINUX x64 SHARDS
  # ==========================================================================

  linux-host-release:
    if: ${{ !inputs.verify_only && (inputs.platforms == 'all' || inputs.platforms == 'linux') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    name: '🐧 Linux x64 Host Release (Dart SDK + GTK + patch)'
    steps:
      - name: Checkout loongbird_flutter
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check existing artifacts on gateway
        id: check
        env:
          LOONGBIRD_GATEWAY_URL: ${{ inputs.gateway_url }}
          LOONGBIRD_API_TOKEN: ${{ secrets.LOONGBIRD_API_TOKEN }}
        run: |
          ENGINE_REV="$(tr -d '[:space:]' < bin/internal/engine.version)"
          echo "ENGINE_REV=$ENGINE_REV" >> "$GITHUB_ENV"
          if [ "${{ inputs.skip_existing_builds }}" = "true" ] && [ -n "$LOONGBIRD_API_TOKEN" ]; then
            if python3 shorebird/ci/loongbird/upload_artifacts.py \
              --check-exists "flutter_infra_release/flutter/${ENGINE_REV}/dart-sdk-linux-x64.zip" \
              --check-exists "flutter_infra_release/flutter/${ENGINE_REV}/linux-x64-release/linux-x64-flutter-gtk.zip" \
              --check-exists "shorebird/${ENGINE_REV}/patch-linux-x64.zip"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "All Linux host_release artifacts already exist on gateway; skipping build."
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Free runner disk space
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Linux build dependencies & Rust target
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libfreetype6-dev pkg-config ninja-build curl zip unzip
          rustup target add x86_64-unknown-linux-gnu

      - name: Configure git auth & depot_tools
        if: ${{ steps.check.outputs.skip != 'true' }}
        env:
          LOONGBIRD_DART_SDK_TOKEN: ${{ secrets.LOONGBIRD_DART_SDK_TOKEN }}
        run: |
          if [ -n "$LOONGBIRD_DART_SDK_TOKEN" ]; then
            git config --global url."https://x-access-token:${LOONGBIRD_DART_SDK_TOKEN}@github.com/cyjaysong/loongbird_dart_sdk".insteadOf "https://github.com/cyjaysong/loongbird_dart_sdk"
            git config --global url."https://x-access-token:${LOONGBIRD_DART_SDK_TOKEN}@github.com/CyJaySong/loongbird_dart_sdk".insteadOf "https://github.com/CyJaySong/loongbird_dart_sdk"
          fi
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: gclient sync (minimal Linux host deps)
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": ".",
              "url": "https://github.com/cyjaysong/loongbird_flutter.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {
                "download_android_deps": False,
                "download_fuchsia_deps": False,
                "download_emsdk": False,
                "download_esbuild": False,
                "download_jdk": False,
                "download_dart_sdk": False,
                "setup_githooks": False,
              },
            },
          ]
          EOF
          gclient sync --no-history --shallow --delete_unversioned_trees

      - name: Build Linux host_release (dart_sdk + flutter_gtk) & patch CLI
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          echo "Building for ENGINE_REV=$ENGINE_REV"

          cargo build --release --manifest-path engine/src/flutter/third_party/updater/patch/Cargo.toml

          python3 shorebird/ci/loongbird/run_gn.py -- --runtime-mode=release
          ninja -C engine/src/out/host_release \
            dart_sdk \
            flutter/shell/platform/linux:flutter_gtk

      - name: Package & stage Linux host_release artifacts
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          python3 shorebird/ci/loongbird/upload_artifacts.py \
            --zip-dir "engine/src/out/host_release/dart-sdk=staged_tmp/dart-sdk-linux-x64.zip:dart-sdk" \
            --zip-file "engine/src/flutter/third_party/updater/target/release/patch=staged_tmp/patch-linux-x64.zip:patch" \
            --stage-dir staged_artifacts \
            --map "staged_tmp/dart-sdk-linux-x64.zip=flutter_infra_release/flutter/${ENGINE_REV}/dart-sdk-linux-x64.zip" \
            --map "engine/src/out/host_release/zip_archives/linux-x64-release/linux-x64-flutter-gtk.zip=flutter_infra_release/flutter/${ENGINE_REV}/linux-x64-release/linux-x64-flutter-gtk.zip" \
            --map "staged_tmp/patch-linux-x64.zip=shorebird/${ENGINE_REV}/patch-linux-x64.zip"

      - name: Upload GitHub Actions artifacts
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: loongbird-linux-host-release-${{ env.ENGINE_REV }}
          path: staged_artifacts
          retention-days: 14

      - name: Upload to Loongbird Gateway
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload_to_gateway }}
        env:
          LOONGBIRD_GATEWAY_URL: ${{ inputs.gateway_url }}
          LOONGBIRD_API_TOKEN: ${{ secrets.LOONGBIRD_API_TOKEN }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.allow_413_fallback }}" = "true" ]; then
            EXTRA_FLAGS="--allow-413-fallback"
          fi
          python3 shorebird/ci/loongbird/upload_artifacts.py \
            --upload-dir staged_artifacts \
            $EXTRA_FLAGS

  linux-host-debug:
    if: ${{ !inputs.verify_only && (inputs.platforms == 'all' || inputs.platforms == 'linux') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    name: '🐧 Linux x64 Host Debug Artifacts'
    steps:
      - name: Checkout loongbird_flutter
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check existing artifacts on gateway
        id: check
        env:
          LOONGBIRD_GATEWAY_URL: ${{ inputs.gateway_url }}
          LOONGBIRD_API_TOKEN: ${{ secrets.LOONGBIRD_API_TOKEN }}
        run: |
          ENGINE_REV="$(tr -d '[:space:]' < bin/internal/engine.version)"
          echo "ENGINE_REV=$ENGINE_REV" >> "$GITHUB_ENV"
          if [ "${{ inputs.skip_existing_builds }}" = "true" ] && [ -n "$LOONGBIRD_API_TOKEN" ]; then
            if python3 shorebird/ci/loongbird/upload_artifacts.py \
              --check-exists "flutter_infra_release/flutter/${ENGINE_REV}/linux-x64/artifacts.zip"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Linux host_debug artifact already exists on gateway; skipping build."
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Free runner disk space
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - name: Install Linux build dependencies & Rust target
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libfreetype6-dev pkg-config ninja-build curl zip unzip
          rustup target add x86_64-unknown-linux-gnu

      - name: Configure git auth & depot_tools
        if: ${{ steps.check.outputs.skip != 'true' }}
        env:
          LOONGBIRD_DART_SDK_TOKEN: ${{ secrets.LOONGBIRD_DART_SDK_TOKEN }}
        run: |
          if [ -n "$LOONGBIRD_DART_SDK_TOKEN" ]; then
            git config --global url."https://x-access-token:${LOONGBIRD_DART_SDK_TOKEN}@github.com/cyjaysong/loongbird_dart_sdk".insteadOf "https://github.com/cyjaysong/loongbird_dart_sdk"
            git config --global url."https://x-access-token:${LOONGBIRD_DART_SDK_TOKEN}@github.com/CyJaySong/loongbird_dart_sdk".insteadOf "https://github.com/CyJaySong/loongbird_dart_sdk"
          fi
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: gclient sync (minimal Linux host deps)
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": ".",
              "url": "https://github.com/cyjaysong/loongbird_flutter.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {
                "download_android_deps": False,
                "download_fuchsia_deps": False,
                "download_emsdk": False,
                "download_esbuild": False,
                "download_jdk": False,
                "download_dart_sdk": False,
                "setup_githooks": False,
              },
            },
          ]
          EOF
          gclient sync --no-history --shallow --delete_unversioned_trees

      - name: Build Linux host_debug artifacts
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          python3 shorebird/ci/loongbird/run_gn.py
          ninja -C engine/src/out/host_debug flutter/build/archives:artifacts

      - name: Stage Linux host_debug artifacts
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          python3 shorebird/ci/loongbird/upload_artifacts.py \
            --stage-dir staged_artifacts \
            --map "engine/src/out/host_debug/zip_archives/linux-x64/artifacts.zip=flutter_infra_release/flutter/${ENGINE_REV}/linux-x64/artifacts.zip"

      - name: Upload GitHub Actions artifacts
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: loongbird-linux-host-debug-${{ env.ENGINE_REV }}
          path: staged_artifacts
          retention-days: 14

      - name: Upload to Loongbird Gateway
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload_to_gateway }}
        env:
          LOONGBIRD_GATEWAY_URL: ${{ inputs.gateway_url }}
          LOONGBIRD_API_TOKEN: ${{ secrets.LOONGBIRD_API_TOKEN }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.allow_413_fallback }}" = "true" ]; then
            EXTRA_FLAGS="--allow-413-fallback"
          fi
          python3 shorebird/ci/loongbird/upload_artifacts.py \
            --upload-dir staged_artifacts \
            $EXTRA_FLAGS

  linux-android-gen-snapshot:
    if: ${{ !inputs.verify_only && (inputs.platforms == 'all' || inputs.platforms == 'linux') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: arm64
            gn_cpu_flag: '--android-cpu=arm64'
            out_dir: android_release_arm64
            archive_subdir: android-arm64-release
          - cpu: arm
            gn_cpu_flag: ''
            out_dir: android_release
            archive_subdir: android-arm-release
          - cpu: x64
            gn_cpu_flag: '--android-cpu=x64'
            out_dir: android_release_x64
            archive_subdir: android-x64-release
    name: '🐧 Linux x64 Android ${{ matrix.cpu }} gen_snapshot'
    steps:
      - name: Checkout loongbird_flutter
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check existing artifacts on gateway
        id: check
        env:
          LOONGBIRD_GATEWAY_URL: ${{ inputs.gateway_url }}
          LOONGBIRD_API_TOKEN: ${{ secrets.LOONGBIRD_API_TOKEN }}
        run: |
          ENGINE_REV="$(tr -d '[:space:]' < bin/internal/engine.version)"
          echo "ENGINE_REV=$ENGINE_REV" >> "$GITHUB_ENV"
          if [ "${{ inputs.skip_existing_builds }}" = "true" ] && [ -n "$LOONGBIRD_API_TOKEN" ]; then
            if python3 shorebird/ci/loongbird/upload_artifacts.py \
              --check-exists "flutter_infra_release/flutter/${ENGINE_REV}/${{ matrix.archive_subdir }}/linux-x64.zip"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Linux Android ${{ matrix.cpu }} gen_snapshot already exists on gateway; skipping build."
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Free runner disk space
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - name: Configure git auth & depot_tools
        if: ${{ steps.check.outputs.skip != 'true' }}
        env:
          LOONGBIRD_DART_SDK_TOKEN: ${{ secrets.LOONGBIRD_DART_SDK_TOKEN }}
        run: |
          if [ -n "$LOONGBIRD_DART_SDK_TOKEN" ]; then
            git config --global url."https://x-access-token:${LOONGBIRD_DART_SDK_TOKEN}@github.com/cyjaysong/loongbird_dart_sdk".insteadOf "https://github.com/cyjaysong/loongbird_dart_sdk"
            git config --global url."https://x-access-token:${LOONGBIRD_DART_SDK_TOKEN}@github.com/CyJaySong/loongbird_dart_sdk".insteadOf "https://github.com/CyJaySong/loongbird_dart_sdk"
          fi
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: gclient sync (Android gen_snapshot deps)
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": ".",
              "url": "https://github.com/cyjaysong/loongbird_flutter.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {
                "download_android_deps": True,
                "download_fuchsia_deps": False,
                "download_emsdk": False,
                "download_esbuild": False,
                "download_jdk": False,
                "download_dart_sdk": False,
                "setup_githooks": False,
              },
            },
          ]
          EOF
          gclient sync --no-history --shallow --delete_unversioned_trees

      - name: Build Android ${{ matrix.cpu }} Linux gen_snapshot
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          python3 shorebird/ci/loongbird/run_gn.py -- --android ${{ matrix.gn_cpu_flag }} --runtime-mode=release
          ninja -C "engine/src/out/${{ matrix.out_dir }}" flutter/shell/platform/android:gen_snapshot

      - name: Stage Linux Android gen_snapshot artifact
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          python3 shorebird/ci/loongbird/upload_artifacts.py \
            --stage-dir staged_artifacts \
            --map "engine/src/out/${{ matrix.out_dir }}/zip_archives/${{ matrix.archive_subdir }}/linux-x64.zip=flutter_infra_release/flutter/${ENGINE_REV}/${{ matrix.archive_subdir }}/linux-x64.zip"

      - name: Upload GitHub Actions artifacts
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: loongbird-linux-android-${{ matrix.cpu }}-${{ env.ENGINE_REV }}
          path: staged_artifacts
          retention-days: 14

      - name: Upload to Loongbird Gateway
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload_to_gateway }}
        env:
          LOONGBIRD_GATEWAY_URL: ${{ inputs.gateway_url }}
          LOONGBIRD_API_TOKEN: ${{ secrets.LOONGBIRD_API_TOKEN }}
        run: |
          python3 shorebird/ci/loongbird/upload_artifacts.py \
            --upload-dir staged_artifacts

  # ==========================================================================
  # WINDOWS x64 SHARDS
  # ==========================================================================

  windows-host-release:
    if: ${{ !inputs.verify_only && (inputs.platforms == 'all' || inputs.platforms == 'windows') }}
    runs-on: windows-2022
    timeout-minutes: 240
    name: '🪟 Windows x64 Host Release (Dart SDK + Flutter DLL + patch.exe)'
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      GYP_MSVS_VERSION: '2022'
    steps:
      - name: Enable git longpaths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Checkout loongbird_flutter
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check existing artifacts on gateway
        id: check
        shell: pwsh
        env:
          LOONGBIRD_GATEWAY_URL: ${{ inputs.gateway_url }}
          LOONGBIRD_API_TOKEN: ${{ secrets.LOONGBIRD_API_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $engineRev = (Get-Content -Raw bin/internal/engine.version).Trim()
          "ENGINE_REV=$engineRev" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ("${{ inputs.skip_existing_builds }}" -eq "true" -and $env:LOONGBIRD_API_TOKEN) {
            python shorebird/ci/loongbird/upload_artifacts.py `
              --check-exists "flutter_infra_release/flutter/$engineRev/dart-sdk-windows-x64.zip" `
              --check-exists "flutter_infra_release/flutter/$engineRev/windows-x64-release/windows-x64-flutter.zip" `
              --check-exists "shorebird/$engineRev/patch-windows-x64.zip"
            if ($LASTEXITCODE -eq 0) {
              "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "All Windows host_release artifacts already exist on gateway; skipping build."
              exit 0
            }
          }
          "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0

      - name: Free runner disk space
        if: ${{ steps.check.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Android", "C:\ghcup", "C:\hostedtoolcache\windows\CodeQL"
          Get-PSDrive -PSProvider FileSystem

      - name: Configure git auth, Rust target & depot_tools
        if: ${{ steps.check.outputs.skip != 'true' }}
        shell: pwsh
        env:
          LOONGBIRD_DART_SDK_TOKEN: ${{ secrets.LOONGBIRD_DART_SDK_TOKEN }}
        run: |
          if ($env:LOONGBIRD_DART_SDK_TOKEN) {
            git config --global "url.https://x-access-token:$($env:LOONGBIRD_DART_SDK_TOKEN)@github.com/cyjaysong/loongbird_dart_sdk.insteadOf" "https://github.com/cyjaysong/loongbird_dart_sdk"
            git config --global "url.https://x-access-token:$($env:LOONGBIRD_DART_SDK_TOKEN)@github.com/CyJaySong/loongbird_dart_sdk.insteadOf" "https://github.com/CyJaySong/loongbird_dart_sdk"
          }
          rustup target add x86_64-pc-windows-msvc
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: gclient sync (minimal Windows host deps)
        if: ${{ steps.check.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          @'
          solutions = [
            {
              "name": ".",
              "url": "https://github.com/cyjaysong/loongbird_flutter.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {
                "download_android_deps": False,
                "download_fuchsia_deps": False,
                "download_emsdk": False,
                "download_esbuild": False,
                "download_jdk": False,
                "download_dart_sdk": False,
                "setup_githooks": False,
              },
            },
          ]
          '@ | Set-Content -Path .gclient -Encoding ascii
          gclient.bat sync --no-history --shallow --delete_unversioned_trees

      - name: Build Windows host_release (dart_sdk + windows_flutter) & patch.exe
        if: ${{ steps.check.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          Write-Host "Building Windows host_release for ENGINE_REV=$env:ENGINE_REV"

          cargo build --release --manifest-path engine/src/flutter/third_party/updater/patch/Cargo.toml

          python3 shorebird/ci/loongbird/run_gn.py -- --runtime-mode=release
          ninja -C engine/src/out/host_release `
            dart_sdk `
            flutter/build/archives:windows_flutter

      - name: Package & stage Windows host_release artifacts
        if: ${{ steps.check.outputs.skip != 'true' }}
        shell: pwsh
        run: |
          python3 shorebird/ci/loongbird/upload_artifacts.py `
            --zip-dir "engine/src/out/host_release/dart-sdk=staged_tmp/dart-sdk-windows-x64.zip:dart-sdk" `
            --zip-file "engine/src/flutter/third_party/updater/target/release/patch.exe=staged_tmp/patch-windows-x64.zip:patch.exe" `
            --stage-dir staged_artifacts `
            --map "staged_tmp/dart-sdk-windows-x64.zip=flutter_infra_release/flutter/$env:ENGINE_REV/dart-sdk-windows-x64.zip" `
            --map "engine/src/out/host_release/zip_archives/windows-x64-release/windows-x64-flutter.zip=flutter_infra_release/flutter/$env:ENGINE_REV/windows-x64-release/windows-x64-flutter.zip" `
            --map "staged_tmp/patch-windows-x64.zip=shorebird/$env:ENGINE_REV/patch-windows-x64.zip"

      - name: Upload GitHub Actions artifacts
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: loongbird-windows-host-release-${{ env.ENGINE_REV }}
          path: staged_artifacts
          retention-days: 14

      - name: Upload to Loongbird Gateway
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload_to_gateway }}
        shell: pwsh
        env:
          LOONGBIRD_GATEWAY_URL: ${{ inputs.gateway_url }}
          LOONGBIRD_API_TOKEN: ${{ secrets.LOONGBIRD_API_TOKEN }}
        run: |
          $extra = @()
          if ("${{ inputs.allow_413_fallback }}" -eq "true") {
            $extra += "--allow-413-fallback"
          }
          python3 shorebird/ci/loongbird/upload_artifacts.py --upload-dir staged_artifacts @extra

  windows-host-debug:
    if: ${{ !inputs.verify_only && (inputs.platforms == 'all' || inputs.platforms == 'windows') }}
    runs-on: windows-2022
    timeout-minutes: 210
    name: '🪟 Windows x64 Host Debug Artifacts'
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      GYP_MSVS_VERSION: '2022'
    steps:
      - name: Enable git longpaths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Checkout loongbird_flutter
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check existing artifacts on gateway
        id: check
        shell: pwsh
        env:
          LOONGBIRD_GATEWAY_URL: ${{ inputs.gateway_url }}
          LOONGBIRD_API_TOKEN: ${{ secrets.LOONGBIRD_API_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $engineRev = (Get-Content -Raw bin/internal/engine.version).Trim()
          "ENGINE_REV=$engineRev" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ("${{ inputs.skip_existing_builds }}" -eq "true" -and $env:LOONGBIRD_API_TOKEN) {
            python shorebird/ci/loongbird/upload_artifacts.py `
              --check-exists "flutter_infra_release/flutter/$engineRev/windows-x64/artifacts.zip"
            if ($LASTEXITCODE -eq 0) {
              "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
