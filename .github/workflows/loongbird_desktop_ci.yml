          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Checkout loongbird_flutter
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git auth, Rust target & depot_tools
        shell: pwsh
        env:
          LOONGBIRD_DART_SDK_TOKEN: ${{ secrets.LOONGBIRD_DART_SDK_TOKEN }}
        run: |
          if ($env:LOONGBIRD_DART_SDK_TOKEN) {
            git config --global "url.https://x-access-token:$($env:LOONGBIRD_DART_SDK_TOKEN)@github.com/cyjaysong/loongbird_dart_sdk.insteadOf" "https://github.com/cyjaysong/loongbird_dart_sdk"
            git config --global "url.https://x-access-token:$($env:LOONGBIRD_DART_SDK_TOKEN)@github.com/CyJaySong/loongbird_dart_sdk.insteadOf" "https://github.com/CyJaySong/loongbird_dart_sdk"
          }
          rustup target add x86_64-pc-windows-msvc
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: gclient sync (minimal Windows host deps)
        shell: pwsh
        run: |
          @'
          solutions = [
            {
              "name": ".",
              "url": "https://github.com/cyjaysong/loongbird_flutter.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {
                "download_android_deps": False,
                "download_fuchsia_deps": False,
                "download_emsdk": False,
                "download_esbuild": False,
                "download_jdk": False,
                "download_dart_sdk": False,
                "setup_githooks": False,
              },
            },
          ]
          '@ | Set-Content -Path .gclient -Encoding ascii
          gclient.bat sync --no-history --shallow --delete_unversioned_trees

      - name: Build Windows host_debug artifacts
        shell: pwsh
        run: |
          $engineRev = (Get-Content -Raw bin/internal/engine.version).Trim()
          "ENGINE_REV=$engineRev" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python3 shorebird/ci/loongbird/run_gn.py
          ninja -C engine/src/out/host_debug flutter/build/archives:artifacts

      - name: Stage Windows host_debug artifacts
        shell: pwsh
        run: |
          python3 shorebird/ci/loongbird/upload_artifacts.py `
            --stage-dir staged_artifacts `
            --map "engine/src/out/host_debug/zip_archives/windows-x64/artifacts.zip=flutter_infra_release/flutter/$env:ENGINE_REV/windows-x64/artifacts.zip"

      - name: Upload GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loongbird-windows-host-debug-${{ env.ENGINE_REV }}
          path: staged_artifacts
          retention-days: 14

      - name: Upload to Loongbird Gateway
        if: ${{ inputs.upload_to_gateway }}
        shell: pwsh
        env:
          LOONGBIRD_GATEWAY_URL: ${{ inputs.gateway_url }}
          LOONGBIRD_API_TOKEN: ${{ secrets.LOONGBIRD_API_TOKEN }}
        run: |
          $extra = @()
          if ("${{ inputs.allow_413_fallback }}" -eq "true") {
            $extra += "--allow-413-fallback"
          }
          python3 shorebird/ci/loongbird/upload_artifacts.py --upload-dir staged_artifacts @extra

  windows-android-gen-snapshot:
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: arm64
            gn_cpu_flag: '--android-cpu=arm64'
            out_dir: android_release_arm64
            archive_subdir: android-arm64-release
          - cpu: arm
            gn_cpu_flag: ''
            out_dir: android_release
            archive_subdir: android-arm-release
