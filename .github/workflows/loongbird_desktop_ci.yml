    name: '🪟 Windows x64 Android ${{ matrix.cpu }} gen_snapshot'
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      GYP_MSVS_VERSION: '2022'
    steps:
      - name: Free runner disk space
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Android", "C:\ghcup", "C:\hostedtoolcache\windows\CodeQL"
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Checkout loongbird_flutter
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git auth & depot_tools
        shell: pwsh
        env:
          LOONGBIRD_DART_SDK_TOKEN: ${{ secrets.LOONGBIRD_DART_SDK_TOKEN }}
        run: |
          if ($env:LOONGBIRD_DART_SDK_TOKEN) {
            git config --global "url.https://x-access-token:$($env:LOONGBIRD_DART_SDK_TOKEN)@github.com/cyjaysong/loongbird_dart_sdk.insteadOf" "https://github.com/cyjaysong/loongbird_dart_sdk"
            git config --global "url.https://x-access-token:$($env:LOONGBIRD_DART_SDK_TOKEN)@github.com/CyJaySong/loongbird_dart_sdk.insteadOf" "https://github.com/CyJaySong/loongbird_dart_sdk"
          }
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: gclient sync (minimal Windows deps)
        shell: pwsh
        run: |
          @'
          solutions = [
            {
              "name": ".",
              "url": "https://github.com/cyjaysong/loongbird_flutter.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {
                "download_android_deps": False,
                "download_fuchsia_deps": False,
                "download_emsdk": False,
                "download_esbuild": False,
                "download_jdk": False,
                "download_dart_sdk": False,
                "setup_githooks": False,
              },
            },
          ]
          '@ | Set-Content -Path .gclient -Encoding ascii
          gclient.bat sync --no-history --shallow --delete_unversioned_trees

      - name: Build Android ${{ matrix.cpu }} Windows gen_snapshot + analyze_snapshot
        shell: pwsh
        run: |
          $engineRev = (Get-Content -Raw bin/internal/engine.version).Trim()
          "ENGINE_REV=$engineRev" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $gnFlags = @('--android', '--runtime-mode=release')
          if ("${{ matrix.gn_cpu_flag }}") {
            $gnFlags += "${{ matrix.gn_cpu_flag }}"
          }
          python3 shorebird/ci/loongbird/run_gn.py -- @gnFlags
          ninja -C "engine/src/out/${{ matrix.out_dir }}" flutter/build/archives:archive_win_gen_snapshot

      - name: Stage Windows Android gen_snapshot artifact
        shell: pwsh
        run: |
          python3 shorebird/ci/loongbird/upload_artifacts.py `
            --stage-dir staged_artifacts `
            --map "engine/src/out/${{ matrix.out_dir }}/zip_archives/${{ matrix.archive_subdir }}/windows-x64.zip=flutter_infra_release/flutter/$env:ENGINE_REV/${{ matrix.archive_subdir }}/windows-x64.zip"

      - name: Upload GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loongbird-windows-android-${{ matrix.cpu }}-${{ env.ENGINE_REV }}
          path: staged_artifacts
          retention-days: 14

      - name: Upload to Loongbird Gateway
        if: ${{ inputs.upload_to_gateway }}
        shell: pwsh
        env:
          LOONGBIRD_GATEWAY_URL: ${{ inputs.gateway_url }}
          LOONGBIRD_API_TOKEN: ${{ secrets.LOONGBIRD_API_TOKEN }}
        run: |
          python3 shorebird/ci/loongbird/upload_artifacts.py --upload-dir staged_artifacts

  # ==========================================================================
  # AUTOMATED ZERO-LOCAL-ENGINE DESKTOP E2E VERIFICATION
  # ==========================================================================

  e2e-linux:
    if: ${{ (inputs.platforms == 'all' || inputs.platforms == 'linux') && inputs.run_e2e && inputs.upload_to_gateway }}
    needs:
      - linux-host-release
      - linux-host-debug
      - linux-android-gen-snapshot
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    name: '🧪 Linux Desktop Zero-Local-Engine E2E'
    steps:
      - name: Checkout loongbird_flutter
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Linux Flutter desktop & Xvfb runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev xvfb libgl1-mesa-dri mesa-utils openssl

      - name: Run automated Linux Desktop E2E
        env:
          LOONGBIRD_GATEWAY_URL: ${{ inputs.gateway_url }}
          LOONGBIRD_API_TOKEN: ${{ secrets.LOONGBIRD_API_TOKEN }}
          LOONGBIRD_CLI_GIT_URL: ${{ secrets.LOONGBIRD_CLI_GIT_URL }}
          LOONGBIRD_CLI_GIT_TOKEN: ${{ secrets.LOONGBIRD_CLI_GIT_TOKEN }}
        run: |
          if [ -z "$LOONGBIRD_API_TOKEN" ] || [ -z "$LOONGBIRD_CLI_GIT_URL" ]; then
            echo "Skipping Linux E2E: LOONGBIRD_API_TOKEN or LOONGBIRD_CLI_GIT_URL secret not configured."
            exit 0
          fi
          ENGINE_REV="$(tr -d '[:space:]' < bin/internal/engine.version)"
          python3 shorebird/ci/loongbird/e2e_desktop.py \
            --platform linux \
            --cli-git-url "$LOONGBIRD_CLI_GIT_URL" \
            --cli-ref "${{ inputs.loongbird_cli_ref }}" \
            --gateway-url "$LOONGBIRD_GATEWAY_URL" \
            --token "$LOONGBIRD_API_TOKEN" \
            --app-id "${{ inputs.e2e_app_id }}" \
            --engine-rev "$ENGINE_REV" \
            --release-version "10.0.${{ github.run_number }}+${{ github.run_number }}"

  e2e-windows:
    if: ${{ (inputs.platforms == 'all' || inputs.platforms == 'windows') && inputs.run_e2e && inputs.upload_to_gateway }}
    needs:
      - windows-host-release
      - windows-host-debug
      - windows-android-gen-snapshot
    runs-on: windows-2022
    timeout-minutes: 60
    name: '🧪 Windows Desktop Zero-Local-Engine E2E'
    steps:
      - name: Checkout loongbird_flutter
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run automated Windows Desktop E2E
        shell: pwsh
        env:
          LOONGBIRD_GATEWAY_URL: ${{ inputs.gateway_url }}
          LOONGBIRD_API_TOKEN: ${{ secrets.LOONGBIRD_API_TOKEN }}
          LOONGBIRD_CLI_GIT_URL: ${{ secrets.LOONGBIRD_CLI_GIT_URL }}
          LOONGBIRD_CLI_GIT_TOKEN: ${{ secrets.LOONGBIRD_CLI_GIT_TOKEN }}
        run: |
          if (-not $env:LOONGBIRD_API_TOKEN -or -not $env:LOONGBIRD_CLI_GIT_URL) {
            Write-Host "Skipping Windows E2E: LOONGBIRD_API_TOKEN or LOONGBIRD_CLI_GIT_URL secret not configured."
            exit 0
          }
          $engineRev = (Get-Content -Raw bin/internal/engine.version).Trim()
          python shorebird/ci/loongbird/e2e_desktop.py `
            --platform windows `
            --cli-git-url "$env:LOONGBIRD_CLI_GIT_URL" `
            --cli-ref "${{ inputs.loongbird_cli_ref }}" `
            --gateway-url "$env:LOONGBIRD_GATEWAY_URL" `
            --token "$env:LOONGBIRD_API_TOKEN" `
            --app-id "${{ inputs.e2e_app_id }}" `
            --engine-rev "$engineRev" `
            --release-version "11.0.${{ github.run_number }}+${{ github.run_number }}"
